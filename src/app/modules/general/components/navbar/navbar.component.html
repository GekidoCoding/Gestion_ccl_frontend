<nav [ngClass]="{
    navbar: true,
    'fixed-top': true,
    'navbar-expand-lg': true,
    'bg-primary': true,
    'hide-sidebar': config?.hideSideBar || config?.hideMenuButton
  }" style="
    background-color: #103373 !important;
    box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px,
      rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
  ">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center w-100">
            <!-- Menu Toggle or Home Link -->
            <ng-container *ngIf="!config?.hideMenuButton">
                <div [ngClass]="{
                'navbar-wrapper': true,
                'hide-sidebar': config?.hideSideBar
              }">
                    <div class="navbar-toggle d-flex" (click)="sidebarToggle()" style="cursor: pointer">
                        <button type="button" class="navbar-toggler">
                            <span class="navbar-toggler-bar bar1"></span>
                            <span class="navbar-toggler-bar bar2"></span>
                            <span class="navbar-toggler-bar bar3"></span>
                        </button>
                        <span class="mt-1" style="color: #fff">Menu</span>
                    </div>
                </div>
            </ng-container>
            <ng-container *ngIf="config?.hideMenuButton">
                <div [ngClass]="{
                'navbar-wrapper': true,
                'hide-sidebar': config?.hideSideBar
              }">
                    <a class="siteP" href="http://192.168.6.80"><i class="fa fas fa-home fa-lg"></i>  Accueil LUCY</a>
                </div>
            </ng-container>

            <!-- User Profile and Logout Link -->
            <div class="d-flex align-items-center">
<!--                <span style="color: white; margin-right: 10px; font-weight: bold" class="nomUser">-->
<!--                    {{ user?.nom ? user?.nom : 'Utilisateur' }} ({{ user?.service ? user?.service : 'Service' }})-->
<!--                </span>-->
<!--                <img-->
<!--                        *ngIf="user?.matricule; else defaultImage"-->
<!--                        width="35px"-->
<!--                        class="imageProfil"-->
<!--                        [src]="FILE_STORAGE + '/files/agent/' + user?.matricule"-->
<!--                        style="-->
<!--                                margin-right: 8px;-->
<!--                                border-radius: 50%;-->
<!--                                margin-top: -1vh !important;-->
<!--                           "-->
<!--                />-->

<!--                <ng-template #defaultImage>-->
<!--                    <img-->
<!--                            width="35px"-->
<!--                            class="imageProfil"-->
<!--                            src="assets/img/user.png"-->
<!--                            style="-->
<!--                              margin-right: 8px;-->
<!--                              border-radius: 50%;-->
<!--                              margin-top: -1vh !important;-->
<!--                            "-->
<!--                    />-->
<!--                </ng-template>-->


                <ul class="navbar-nav">
                    <li style="margin-left: 20px; margin-right: 40px" class="nav-item notification-bell" [ngClass]="{'active': notificationSidebarOpen}" (click)="toggleNotificationSidebar()">
                        <i class="fas fa-bell"></i>
                        <span class="badge" *ngIf="totalNotifsNonLus > 0">{{totalNotifsNonLus}}</span>
                    </li>
                    <li class="nav-item">
                        <button class="logout-btn" (click)="confirmLogout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Déconnexion</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Collapsible Menu Items -->
        <div class="navbar-collapse collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <ul [ngClass]="{
            'navbar-nav': true,
            'hide-sidebar': config?.hideSideBar
          }">
                    <li *ngFor="let item of items" [ngClass]="{
              'nav-item': true,
              dropdown: item.isDropDown,
              active: item.isActive
            }">
                        <a *ngIf="!item.isDropDown" class="nav-link d-flex" [routerLink]="item.link"><i [class]="item.iconName"></i>
                              {{ item.displayName }}</a>
                        <a *ngIf="item.isDropDown" class="nav-link d-flex" id="navbarDropdownMenuLink" data-toggle="dropdown"
                           aria-haspopup="true" aria-expanded="false"><i [class]="item.iconName"></i>  
                            {{ item.displayName }}
                             <span class="dropdown-toggle"></span>
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                            <a class="dropdown-item" *ngFor="let dropdownItem of item.dropndownElements"
                               [routerLink]="dropdownItem.link">{{ dropdownItem.displayName }}</a>
                        </div>
                    </li>
                </ul>
            </ul>
        </div>
    </div>

    <div class="notification-sidebar" [ngClass]="{'open': notificationSidebarOpen}">
        <div class="sidebar-header">
            <div class="sidebar-controls">
                <select style="margin-top: 6%" class="form-group" [(ngModel)]="notificationFilter" (ngModelChange)="filterNotifications()">
                    <option value="">Toutes</option>
                    <option *ngFor="let type of typeNotifications" [value]="type.id">{{type.libelle}}</option>
                </select>
<!--                <button class="btn btn-green" (click)="markAllread()" [disabled]="filteredNotifications.length === 0"><i style="color:#FFFFFF" class="fas fa-eye"></i> tout comme lu</button>-->
            </div>
            <button class="close-btn" (click)="toggleNotificationSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sidebar-content">
            <ul class="notification-list">
                <ng-container *ngIf="filteredNotifications.length > 0; else noNotifications">
                    <li *ngFor="let notification of filteredNotifications" (click)="openMouvementDetail(notification?.mouvement?.id)" class="notification-item"
                        [ngClass]="getNotificationClass(notification)">
                        <i class="fas fa-info-circle"></i>
                        <span>{{ notification.message }}</span>
<!--                        <button *ngIf="!notification.read" (click)="markAsRead(notification.id)"  class="btn btn-update"><i class="fas fa-eye"></i></button>-->
                    </li>
                </ng-container>
                <ng-template #noNotifications>
                    <li class="no-notifications">Aucune notification</li>
                </ng-template>
            </ul>
        </div>
    </div>
</nav>
