<!--<div class="modal-content">-->
<div class="modal-header">
    <h5 class="modal-title" style="color: #b59d05">
        <i class="fas fa-exclamation-triangle warning-icon"></i> Avertissement
    </h5>
    <button type="button" class="close" style="color: #0a1f4e" (click)="this.activeModal.dismiss('Close click')" aria-label="Fermer">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
  <textarea
      #textAreaRef
      readonly
      [value]="message"
      (input)="autoResizeTextArea(textAreaRef)"
      style="width: 100%; overflow: hidden; resize: none;"
  ></textarea>
</div>


<div class="modal-footer">
    <button type="button" class="btn btn-red btn-animated" (click)="onClose()">
        <i class="fas fa-times"></i> Non
    </button>
    <button type="button" class="btn btn-green btn-animated" (click)="onConfirm()">
        <i class="fas fa-check"></i> Oui
    </button>
</div>
