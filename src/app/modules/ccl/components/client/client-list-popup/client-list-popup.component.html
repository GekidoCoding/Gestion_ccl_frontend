<div class="modal-header">
    <h5 class="modal-title">Liste Des Clients</h5>
    <button type="button" class="close" (click)="activeModal.dismiss('Cross Click')" aria-label="Close">
        <span aria-hidden="true">×</span>
    </button>
</div>

<div class="modal-body">
    <app-loading [loading]="isLoading"></app-loading>
    <div class="action-buttons mb-3">
        <button type="button" class="btn btn-add" (click)="openAddModal()">
            <i class="fa fa-plus"></i> Ajouter un client
        </button>
    </div>

    <div class="table-controls">
        <div class="entries-select">
            <label style="margin-top: 10px;">Afficher</label>
            <select [(ngModel)]="itemsPerPage" (ngModelChange)="changePage(1)">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span>entrée(s)</span>
        </div>

        <div class="search-form slide-in-out">
            <form #searchForm="ngForm" (ngSubmit)="applySearches()">
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label>Type Client</label>
                        <select class="form-control" name="typeClient" [(ngModel)]="searchCriteria.typeClient.id">
                            <option value="">-- Sélectionnez le type de client --</option>
                            <option *ngFor="let type of typeClients" [value]="type.id">{{ type.typeClient }}</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3">
                        <label>Designation client</label>
                        <input type="text" class="form-control" placeholder="Ex : CNaPS ou RAKOTO" name="designationClient"
                               [formControl]="designationCtrl" [matAutocomplete]="autoDesignation">
                        <mat-autocomplete #autoDesignation="matAutocomplete" [displayWith]="displayValueFn">
                            <mat-option *ngFor="let client of filteredDesignations | async" [value]="client.designationClient">
                                {{ client.designationClient }}
                            </mat-option>
                        </mat-autocomplete>
                    </div>
                    <div class="form-group col-md-3">
                        <label>Email</label>
                        <input type="text" class="form-control" [(ngModel)]="searchCriteria.email" placeholder="Ex : rakoto2505@gmail.com" name="email" email>
                    </div>
                    <div class="form-group col-md-3">
                        <label>Contacts</label>
                        <input type="text" class="form-control" placeholder="Ex : 0344444444" name="contacts"
                               [formControl]="contactsCtrl" [matAutocomplete]="autoContacts">
                        <mat-autocomplete #autoContacts="matAutocomplete" [displayWith]="displayValueFn" >
                            <mat-option *ngFor="let client of filteredContacts | async" [value]="client.contacts">
                                {{ client.contacts }}
                            </mat-option>
                        </mat-autocomplete>
                    </div>
                    <div class="form-group col-md-12" style="margin-top: 10px">
                        <button type="button" class="btn btn-red" (click)="resetSearchForm()">
                            <i class="fas fa-times"></i> Effacer
                        </button>
                        <button type="submit" class="btn btn-search">
                            <i class="fas fa-search"></i> Rechercher
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-normal" *ngIf="items.length > 0">
                <thead class="thead-light">
                <tr>
                    <th scope="col">Type</th>
                    <th scope="col">Designation client</th>
                    <th scope="col">Contact(s)</th>
                    <th scope="col" class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let item of items" class="row-animation">
                    <td>{{ item.typeClient.typeClient }}</td>
                    <td>{{ item.designationClient }}</td>
                    <td>{{ item.contacts }}</td>
                    <td class="action-column action-buttons-cell">
                        <button class="btn btn-eye" (click)="openDetailModal(item)">
                            <i class="fa fa-info-circle"></i>
                        </button>
                        <button class="btn btn-green" (click)="selectionnedClient(item.id)">
                            <i class="fa fa-check"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <div *ngIf="items.length === 0 && !isLoading" class="text-muted mt-3">Aucun client trouvé pour le moment.</div>
        </div>

        <div class="pagination-controls" *ngIf="totalPages > 1">
            <div class="pagination-container">
                <button type="button" class="btn btn-blue btn-arrow" [disabled]="currentPage === 0" (click)="changePage(currentPage)">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="pagination-buttons">
          <span *ngFor="let page of pageNumbers" class="page-number btn btn-blue page-animation" [class.active]="page === currentPage + 1" (click)="changePage(page)">
            {{ page }}
          </span>
                </div>
                <button type="button" class="btn btn-blue btn-arrow" [disabled]="currentPage + 1 === totalPages || totalPages === 0" (click)="changePage(currentPage + 2)">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
