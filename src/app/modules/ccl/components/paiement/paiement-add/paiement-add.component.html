<div class="modal-header">
    <h5 class="modal-title">Ajouter un paiement </h5>
    <button type="button" class="close" (click)="activeModal.dismiss('Cross click')" aria-label="Close">
        <span aria-hidden="true">×</span>
    </button>
</div>
<div class="modal-body">
    <app-loading [loading]="isLoading"></app-loading>
    <form  #paiementForm="ngForm" (ngSubmit)="create()">
        <div class="form-row">
<!--            <div class="form-group col-md-12" [ngClass]="{'form-group-error': acompteVerse.touched && (!acompteVerse.valid)}">-->
<!--                <label>Facture  <strong style="color: red">*</strong></label>-->
<!--                <input type="number" class="form-control" [(ngModel)]="newPaiement.facture.id" name="acompteVerse" #acompteVerse="ngModel" required>-->
<!--                <div class="error-message" *ngIf="acompteVerse.touched && !acompteVerse.valid">-->
<!--                    <i class="fas fa-exclamation-circle"></i> Le champ date de paiement est requis.-->
<!--                </div>-->
<!--            </div>-->
            <div class="form-group col-md-12" [ngClass]="{'form-group-error': acompteVerse.touched && (!acompteVerse.valid)}">
                <label>Acompte versé par le client (Ariary) <strong style="color: red">*</strong></label>
                <input type="number" class="form-control" [(ngModel)]="newPaiement.acompteVerse" name="acompteVerse" #acompteVerse="ngModel" required>
                <div class="error-message" *ngIf="acompteVerse.touched && !acompteVerse.valid">
                    <i class="fas fa-exclamation-circle"></i> Le champ date de paiement est requis.
                </div>
            </div>
            <div class="form-group col-md-12" [ngClass]="{'form-group-error': modePaiement.touched && !modePaiement.valid}">
                <label>Mode de paiement<strong style="color: red">*</strong></label>
                <select class="form-control" [(ngModel)]="newPaiement.modePaiement.id" name="modePaiement" [ngModel]="newPaiement.modePaiement.id??null"  #modePaiement="ngModel" required>
                    <option [ngValue]="null">-- Sélectionnez le mode de paiement --</option>
                    <option *ngFor="let type of modePaiements" [ngValue]="type.id">{{ type.libelle }}</option>
                </select>
                <div class="error-message" *ngIf="modePaiement.touched && !modePaiement.valid">
                    <i class="fas fa-exclamation-circle"></i> Le champ mode de paiement est requis.
                </div>
            </div>
<!--            <div class="form-group col-md-12" >-->
<!--                <label>Date de paiement</label>-->
<!--                <input type="datetime-local" class="form-control" [(ngModel)]="newPaiement.datePaiement" name="datePaiement" >-->
<!--            </div>-->
            <div class="modal-footer">
                <button type="button" class="btn btn-red" (click)="activeModal.dismiss('Cross click')"><i class="fas fa-times"></i> Annuler</button>
                <button type="submit" class="btn btn-green">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </div>
        </div>

    </form>

</div>
